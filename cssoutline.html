<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #firstp {
             border: 2px solid black;
             outline: 5px dashed red;
             margin: auto;
             padding:20px;
             text-align: center;
             color:blue;
             text-decoration: underline;

        }

        p {
            color: red;
            margin: 50px;
            text-decoration-line: underline;
            text-decoration-style: wavy;
            text-transform: capitalize;
            word-spacing: 10px;
            line-height: 30px;
            font-size: 20px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-style: oblique;

        }
    </style>
</head>
<body>

    <h2>CSS Outline</h2>

    <p id="firstp">CSS Outline is a shorthand property for setting one or more of the individual outline properties in a single declaration.</p>
    
    <p>
        here some more text to style .
     </p>
