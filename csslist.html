<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        ul {
        
            list-style-type: circle ; 
            margin-left: 20px;
        }

        #secondlist {
            list-style-type: square;
            margin-left: 20px;
        }

        ol {
            list-style-type: lower-alpha;
            margin-left: 20px;
        }

        h1 {
            color: blue;
            font-size: 30px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        h2 {
            color: green;
            font-size: 24px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        </style>
</head>
<body>

    <h1>Welcome to List</h1>

    <h2>Unordered List</h2>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

     <ul id="secondlist">
        <li>Item 4</li>
        <li>Item 5</li>
        <li>Item 6</li>
    </ul>

    <h2>Ordered List</h2>
       <ol>
        <li>First Item</li>
        <li>Second Item</li>
        <li>Third Item</li>

        </ol>   

</body>
</html>
