<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box{
            width:200px;
            height:200px
        }
        .red-box{
            position: relative;
            z-index: 2;
            background: red;
        }
        .blue-box{
            position:relative;
            z-index: 1;
            background: blue;
            margin-top: -50px;
        
        }


    </style>
</head>
<body>

    <h1>Z-index example</h1>

    <div class="box red-box">Box 1</div>
    <div class="box blue-box">Box 2</div>
    
</body>
</html>
